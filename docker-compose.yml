services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .deploy/postgres.env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .deploy/backend.env
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres-data:
